<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RaktSetu</title>
<style>
:root{--ground:#e8ecf0;--panel:#fff;--ink:#1b2130;--soft:#5d6677;--line:#d3d9e1;--blood:#b3122b;--blood-bg:#f8dde1;--amber:#a86a00;--amber-bg:#fbebc9;--ok:#0f6e5f;--focus:#2154d1;--liquid:var(--blood)}
body.plt{--liquid:#e0a21b}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
header{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;padding-top:22px;padding-bottom:18px}
.mark{font:700 1.7rem/1 Georgia,serif;letter-spacing:-.02em;margin:0}
.date{color:var(--soft);margin:4px 0 0;font-size:.95rem}
.seg{display:inline-flex;background:#d6dce4;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:8px;font:inherit;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0003}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:22px;padding-bottom:48px;align-items:start}
.bags{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bag{position:relative;aspect-ratio:3/4;border:2px solid var(--ink);border-radius:18px 18px 28px 28px;background:#fff;overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;font:inherit;color:inherit;transition:transform .15s}
.bag:hover{transform:translateY(-3px)}
.bag::before{content:"";position:absolute;top:0;left:50%;width:30px;height:11px;margin-left:-15px;background:var(--ink);border-radius:0 0 7px 7px;z-index:2}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--liquid);opacity:.88;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.fill::before{content:"";position:absolute;left:0;right:0;top:-7px;height:14px;background:var(--liquid);opacity:.88;border-radius:50%}
.label{position:relative;z-index:1;width:74%;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:8px 6px 7px;text-align:center}
.label b{display:block;font:700 2.1rem/1 Rockwell,"Roboto Slab",Cambria,Georgia,serif}
.label b sup{font-size:.55em;vertical-align:.5em;margin-left:1px}
.label span{font-size:.85rem;color:var(--soft)}
.bag.low .label span{color:var(--blood);font-weight:700}
.bag.zero{border-style:dashed;background:repeating-linear-gradient(135deg,#fff 0 9px,#f4e6e8 9px 18px)}
.bag.zero .label span{color:var(--blood);font-weight:700}
.bag[aria-pressed=true]{outline:4px solid var(--focus);outline-offset:3px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hint{color:var(--soft);margin:14px 2px 0;font-size:.95rem}
.side{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-size:1.05rem;margin:0 0 12px}
.empty{color:var(--soft);margin:0}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:8px 6px;border-radius:8px;cursor:pointer}
.row:hover{background:#f2f4f7}
.days{flex:none;min-width:52px;text-align:center;font-weight:700;font-size:.85rem;padding:3px 8px;border-radius:99px;background:var(--amber-bg);color:var(--amber)}
.days.hot{background:var(--blood-bg);color:var(--blood)}
.row small{display:block;color:var(--soft)}
.detail h3{margin:0;font:700 2.3rem/1 Rockwell,Cambria,Georgia,serif}
.detail h3 sup{font-size:.55em}
.sub{color:var(--soft);margin:2px 0 14px}
.bank{display:grid;grid-template-columns:1fr 90px 28px;gap:10px;align-items:center;padding:5px 0;font-size:.95rem}
.meter{height:8px;background:#e6eaef;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--liquid)}
.bank b{text-align:right}.bank b.z{color:var(--blood)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 12px;font:600 .95rem Rockwell,Cambria,Georgia,serif;cursor:pointer}
.chip.exact{border-color:var(--ink)}.chip.univ{border-style:dashed}
.chip:hover{background:#f2f4f7}
.label2{font-weight:600;font-size:.92rem;margin:0}
.note{color:var(--soft);font-size:.85rem;margin:2px 0 0}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
select,input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
select{flex:1 1 160px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:#f2f4f7;width:34px;height:38px;font-size:1.2rem;cursor:pointer}
.qty input{width:48px;border:0;text-align:center;border-radius:0;padding:8px 0}
.go{flex:1 1 100%;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;padding:11px;border-radius:8px;cursor:pointer}
.go:hover{background:#2c3550}
.log{list-style:none;margin:0;padding:0;font-size:.9rem;display:grid;gap:8px}
.log small{display:block;color:var(--soft)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;transition:transform .3s;max-width:90vw;z-index:9}
#toast.on{transform:translate(-50%,0)}#toast.err{background:var(--blood)}
.go.red{background:var(--blood)}.go.red:hover{background:#8f0e22}
.req select,.req .qty{flex:1 1 120px}
.res{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.res h3{font-size:1.05rem;margin:0 0 4px}.res ul{margin:6px 0 10px;padding-left:18px;color:var(--soft);font-size:.92rem}
.two{display:flex;gap:8px;flex-wrap:wrap}.two button,.ghost{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.two button:hover,.ghost:hover{background:#f2f4f7}.ghost{margin-top:10px;width:100%;color:var(--soft)}
.toplink{color:var(--soft);font-size:.95rem;margin-left:auto}
.call{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}.call:first-of-type{border-top:0}
.call b.open{color:var(--blood)}.call b.covered{color:var(--ok)}.call small{display:block;color:var(--soft)}
@media(max-width:860px){main{grid-template-columns:1fr}.bags{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="wrap"><header>
  <div><h1 class="mark">RaktSetu</h1><p class="date" id="date"></p></div>
  <a class="toplink" href="/donor">Donor app &rarr;</a><a class="toplink" href="/bank">Bank desk &rarr;</a>
  <div class="seg" role="group" aria-label="Blood component">
    <button id="c-RBC" aria-pressed="true">Red cells</button><button id="c-PLT" aria-pressed="false">Platelets</button>
  </div>
</header>
<main>
  <section><div class="bags" id="bags"></div>
    <p class="hint" id="hint">Each bag shows how much of that blood group the city holds. Tap one to see where it is and who can receive from it.</p></section>
  <aside class="side">
    <div class="card req"><h2>Emergency request</h2>
      <form id="rf"><select id="rh" aria-label="Hospital"></select><select id="rg" aria-label="Blood group"></select>
      <div class="qty"><button type="button" data-q="-1" aria-label="Fewer">\u2212</button><input id="rq" type="number" min="1" max="10" value="1" aria-label="Units"><button type="button" data-q="1" aria-label="More">+</button></div>
      <button class="go red">Find <span id="rc">red cells</span> now</button></form>
      <div id="rres"></div>
      <button class="ghost" id="race">Run race test: 6 requests at the same moment</button></div>
    <div class="card" id="calls"></div>
    <div class="card detail" id="detail"></div>
    <div class="card"><h2>Use these first</h2><div id="exp"></div></div>
    <div class="card"><h2>Recent activity</h2><ul class="log" id="log"></ul></div>
  </aside>
</main></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G=g=>g.slice(0,-1)+"<sup>"+(g.endsWith("+")?"+":"\u2212")+"</sup>";
const NAME={RBC:"red cells",PLT:"platelets"};
const ACT={ADD_UNITS:"Stock added",SEED:"Demo data loaded",EXPIRE_SWEEP:"Expired units cleared"};
let S,comp="RBC",sel=null;

async function load(){S=await (await fetch("/api/state")).json();render()}
const total=g=>Object.values(S.stock[comp][g]).reduce((a,b)=>a+b,0);

function render(){
  document.body.classList.toggle("plt",comp==="PLT");
  $("#c-RBC").setAttribute("aria-pressed",comp==="RBC");$("#c-PLT").setAttribute("aria-pressed",comp==="PLT");
  $("#date").textContent=new Date(S.today+"T00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+". Demo data, fictional banks.";
  const max=Math.max(1,...S.groups.map(total));
  $("#bags").innerHTML=S.groups.map(g=>{const n=total(g),h=n?Math.max(14,n/max*88):0;
    return `<button class="bag ${n===0?"zero":n<=2?"low":""}" data-g="${g}" aria-pressed="${sel===g}" aria-label="${g}, ${n} units">
      <div class="fill" style="height:${h}%"></div>
      <div class="label"><b>${G(g)}</b><span>${n===0?"None left":n<=2?n+" left":n+" units"}</span></div></button>`}).join("");
  $("#exp").innerHTML=S.expiring.length?S.expiring.map((r,i)=>{const d=Math.round((new Date(r.expires_on)-new Date(S.today))/864e5);
    return `<button class="row" data-i="${i}"><span class="days ${d<=1?"hot":""}">${d===0?"today":d+" day"+(d>1?"s":"")}</span>
      <span>${r.n} \u00d7 ${G(r.blood_group)} ${NAME[r.component]}<small>${esc(r.bank)}</small></span></button>`}).join(""):'<p class="empty">Nothing expires in the next 3 days.</p>';
  $("#log").innerHTML=S.audit.map(a=>`<li>${ACT[a.action]||esc(a.action)}<small>${esc(a.detail)}</small></li>`).join("");
  calls();detail();fillReq();
}

function calls(){
  const open=S.calls.some(c=>c.status==="open");
  $("#calls").innerHTML=`<h2>Donor calls</h2>${S.calls.length?S.calls.map(c=>`<div class="call"><b class="${c.status}">${c.status==="open"?"Open":c.status==="covered"?"Covered":"Closed"}</b> ${c.slots_needed} \u00d7 ${G(c.blood_group)} ${NAME[c.component]} at ${esc(c.bank)}
    <small>${c.slots_filled}/${c.slots_needed} donors confirmed. Wave ${c.wave} of ${S.waves}, ${c.alerted} alerted${c.declined?", "+c.declined+" passed":""}.</small><small>${esc(c.hospital?"For "+c.hospital:c.reason)}</small>
    ${c.status==="open"&&c.alerted?`<button class="ghost" style="margin-top:6px;padding:5px 10px" data-call="race" data-id="${c.id}">Simulate: all alerted donors accept at once</button>`:""}</div>`).join(""):'<p class="empty">No open calls. Donors are alerted automatically when a request cannot be covered from stock.</p>'}
  <div class="two" style="margin-top:10px"><button data-call="scan">Scan for low stock</button><button data-call="tick" ${open?"":"disabled"} title="Normally waves widen after ${S.wave_timeout_min} minutes">Skip wait: next wave</button></div>`;
}

function detail(){
  const el=$("#detail");
  if(!sel){el.innerHTML='<h2>Pick a blood group</h2><p class="empty">Tap a bag to see which banks hold it, who can receive from it, and to add stock.</p>';return}
  const per=S.stock[comp][sel],n=total(sel),mx=Math.max(1,...Object.values(per));
  const from=S.receive_from[comp][sel];
  el.innerHTML=`<h3>${G(sel)}</h3><p class="sub">${n} unit${n===1?"":"s"} of ${NAME[comp]} across ${Object.values(per).filter(x=>x).length} of ${S.banks.length} banks</p>
  ${S.banks.map(b=>`<div class="bank"><span>${esc(b.name)}</span><span class="meter"><i style="width:${per[b.id]/mx*100}%"></i></span><b class="${per[b.id]?"":"z"}">${per[b.id]}</b></div>`).join("")}
  <p class="label2" style="margin-top:16px">A ${G(sel)} patient can receive from</p>
  <div class="chips">${from.map((g,i)=>`<button class="chip ${i===0?"exact":g==="O-"&&comp==="RBC"?"univ":""}" data-g="${g}" title="${i===0?"Exact match, best choice":g==="O-"&&comp==="RBC"?"Universal donor: save for those who need it":"Substitute"}">${G(g)}</button>`).join("")}</div>
  <p class="note">Best match first. O\u2212 is the universal donor, so it is listed last on purpose.</p>
  <p class="label2" style="margin-top:16px">Add ${G(sel)} ${NAME[comp]}</p>
  <form id="add"><select id="bank">${S.banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select>
    <div class="qty"><button type="button" data-d="-1" aria-label="Fewer">\u2212</button><input id="qty" type="number" min="1" max="50" value="1" aria-label="Quantity"><button type="button" data-d="1" aria-label="More">+</button></div>
    <button class="go">Add to stock</button></form>`;
}

function toast(m,err){const t=$("#toast");t.textContent=m;t.className="on"+(err?" err":"");clearTimeout(t.h);t.h=setTimeout(()=>t.className="",3200)}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.call){
    if(t.dataset.call==="scan"){const[ok,d]=await post("/api/calls/scan",{});if(!ok)return toast(d.error,true);await load();return toast(d.opened.length?`Called donors for ${d.opened.map(o=>o.blood_group).join(", ")}.`:"No group is critically low.")}
    if(t.dataset.call==="tick"){const[ok,d]=await post("/api/calls/tick",{force:true});if(!ok)return toast(d.error,true);await load();return toast(d.moved.length?"Moved to the next wave.":"Nothing to escalate.")}
    if(t.dataset.call==="race"){t.disabled=true;const[ok,d]=await post("/api/calls/race",{call_id:t.dataset.id});if(!ok){t.disabled=false;return toast(d.error,true)}await load();
      return toast(`${d.donors} donors accepted at once for ${d.slots} slot${d.slots===1?"":"s"}: ${d.won} won, ${d.covered} saw \"already covered\". Overbooked: ${d.overbooked}.`)}
  }
  if(t.dataset.q){const q=$("#rq");q.value=Math.min(10,Math.max(1,+q.value+ +t.dataset.q));return}
  if(t.dataset.act){const[ok,d]=await post("/api/request/"+t.dataset.act,{request_id:t.dataset.rid});if(!ok)return toast(d.error,true);
    $("#rres").innerHTML="";await load();return toast(t.dataset.act==="issue"?"Marked as issued.":"Reservation cancelled, units are back in stock.")}
  if(t.id==="race"){t.disabled=true;t.textContent="Running...";const[ok,d]=await post("/api/race",{group:$("#rg").value,component:comp});
    t.disabled=false;t.textContent="Run race test: 6 requests at the same moment";if(!ok)return toast(d.error,true);await load();
    $("#rres").innerHTML=`<div class="res"><h3>Race test: ${d.requests} requests at once</h3><p class="empty">${d.supply} compatible unit${d.supply===1?"":"s"} in the city. <b>${d.served} served</b>, ${d.turned_away} turned away, ${d.rerouted} rerouted after losing a race. <b>${d.oversold} oversold.</b> Stock restored afterwards.</p></div>`;return}
  if(t.id==="c-RBC"||t.id==="c-PLT"){comp=t.id.slice(2);return render()}
  if(t.dataset.g){sel=t.dataset.g;return render()}
  if(t.classList.contains("row")){const r=S.expiring[t.dataset.i];comp=r.component;sel=r.blood_group;return render()}
  if(t.dataset.d){const q=$("#qty");q.value=Math.min(50,Math.max(1,+q.value+ +t.dataset.d))}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="rf")return reqSubmit();
  const res=await fetch("/api/add",{method:"POST",body:JSON.stringify({bank_id:$("#bank").value,group:sel,component:comp,qty:$("#qty").value})});
  const d=await res.json();
  if(!res.ok)return toast(d.error,true);
  const q=$("#qty").value;await load();
  toast(`Added ${q} \u00d7 ${sel} ${NAME[comp]} to ${d.bank}. Expires ${new Date(d.expires).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}.`);
});
async function post(u,b){const r=await fetch(u,{method:"POST",body:JSON.stringify(b)});return[r.ok,await r.json()]}
function fillReq(){
  if(!$("#rh").options.length){$("#rh").innerHTML=S.hospitals.map(x=>`<option value="${x.id}">${esc(x.name)}${x.verified?"":" (not verified)"}</option>`).join("");
    $("#rg").innerHTML=S.groups.map(g=>`<option>${g}</option>`).join("")}
  if(sel)$("#rg").value=sel;$("#rc").textContent=NAME[comp]}
async function reqSubmit(){
  const g=$("#rg").value,[ok,d]=await post("/api/request",{hospital_id:$("#rh").value,group:g,component:comp,qty:$("#rq").value});
  if(!ok)return toast(d.error,true);
  await load();
  if(d.status!=="reserved"){const dc=d.donor_call,msg=dc?(dc.existing?"A donor call is already open.":dc.alerted+" nearby eligible donor"+(dc.alerted===1?"":"s")+" alerted."):"";
    $("#rres").innerHTML=`<div class="res"><h3>Nothing available</h3><p class="empty">No bank can supply this right now. ${msg?"<b>"+msg+"</b>":""}</p></div>`;return}
  const b=d.bank,alt=d.ranking.slice(1,3);
  $("#rres").innerHTML=`<div class="res"><h3>Reserved: ${b.units.replace(/([ABO]+)([+-])/g,(m,x,y)=>x+(y==="-"?"\u2212":"+"))} ${NAME[comp]}</h3>
    <p class="empty"><b style="color:var(--ink)">${esc(b.bank)}</b>, ${b.km} km away. Held until ${new Date(d.hold_until).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}.</p>
    ${d.fallthroughs.length?`<p class="note">Lost the race at ${esc(d.fallthroughs.join(", "))} and rerouted automatically.</p>`:""}
    <p class="label2" style="margin-top:10px">Why this bank</p><ul>${b.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
    ${alt.length?`<p class="note">Also considered: ${alt.map(a=>esc(a.bank)+" ("+a.score+")").join(", ")}. This bank scored ${b.score}.</p>`:""}
    <div class="two"><button data-act="issue" data-rid="${d.request_id}">Mark as issued</button><button data-act="cancel" data-rid="${d.request_id}">Cancel and release</button></div></div>`}
load();
</script></body></html>
